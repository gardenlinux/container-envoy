name: Build FIPS Envoy image

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 1.40.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 1.40.1)'
        required: false
        default: ''
permissions:
  packages: write
  contents: write

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.57.1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push amd64 image
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-envoy
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-envoy-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-envoy-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION}-amd64

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-amd64
          path: .build/envoy-fips-build/*.cdx.json
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.57.1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push arm64 image
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gl-fips-envoy
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-envoy-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-envoy-fips.sh
          docker push ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION}-arm64

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-arm64
          path: .build/envoy-fips-build/*.cdx.json
          if-no-files-found: error

  push-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    outputs:
      image_digest: ${{ steps.manifest.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        id: manifest
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-envoy-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          docker manifest create \
            ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION} \
            ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION}-amd64 \
            ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION}-arm64
          docker manifest push ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION}
          DIGEST=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION} \
            | jq -r '.manifests[0].digest')
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64, push-manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download amd64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-amd64
          path: sbom/
      - name: Download arm64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-arm64
          path: sbom/
      - name: Download build logs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_ZIP=/tmp/build-logs-${{ github.run_id }}.zip
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs \
            > "${LOG_ZIP}"
          # gh api writes the 404 JSON error body to stdout on failure;
          # validate the file is actually a zip and discard it if not.
          if ! python3 -c "import zipfile,sys; zipfile.ZipFile('${LOG_ZIP}').namelist()" 2>/dev/null; then
            echo "Downloaded file is not a valid zip (likely a 404 error response); discarding."
            rm -f "${LOG_ZIP}"
          fi

      - name: Generate SLSA provenance
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_DIGEST: ${{ needs.push-manifest.outputs.image_digest }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-envoy-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          python3 generate-provenance.py \
            --app envoy \
            --version "${VERSION}" \
            --image-name "ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION}" \
            --image-digest "${{ needs.push-manifest.outputs.image_digest }}" \
            --sbom-dir sbom/ \
            --log-zip /tmp/build-logs-${{ github.run_id }}.zip \
            --output /tmp/provenance.json

      - name: Publish GitHub Release with SBOMs
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-envoy-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          {
            echo "FIPS-enabled Envoy image v${VERSION}"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/gl-fips-envoy:${VERSION}"
            echo '```'
          } > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            || gh release edit "v${VERSION}" \
                 --repo "${{ github.repository }}" \
                 --title "v${VERSION}" \
                 --notes-file /tmp/release-notes.md
          LOG_ZIP=/tmp/build-logs-${{ github.run_id }}.zip
          EXTRA_ASSETS=$([ -f "${LOG_ZIP}" ] && echo "${LOG_ZIP}" || echo "")
          gh release upload "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --clobber \
            sbom/*.cdx.json \
            /tmp/provenance.json \
            ${EXTRA_ASSETS}
